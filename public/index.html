
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>USD Loan Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            margin: auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #bbb;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            color: black;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .amount {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0;
            color: #111;
        }

        .slider {
            width: 100%;
            cursor: pointer;
            accent-color: #ff9800;
        }

        .labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        .term-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .term {
            padding: 10px;
            border-radius: 10px;
            background: #eee;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .term:hover {
            background: #ddd;
        }

        .term.active {
            background: linear-gradient(90deg, #ff9800, #ff7043);
            color: white;
        }

        .result {
            background: #f1f1f1;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .result-title {
            font-size: 14px;
            color: #777;
            margin-bottom: 5px;
        }

        .payment {
            font-size: 26px;
            font-weight: bold;
            margin-top: 5px;
            color: #111;
        }

        .apply {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            color: white;
            cursor: pointer;
            background: linear-gradient(90deg, #ff9800, #ff7043);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: 0.2s;
        }

        .apply:hover {
            transform: translateY(-1px);
            box-shadow: 0 7px 18px rgba(0, 0, 0, 0.25);
        }

        .info {
            background: #f5f5f5;
            margin-top: 15px;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
            color: #111;
        }

        .icon {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: 50%;
            background: #4a2c6b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .info b {
            font-size: 14px;
        }

        .info small {
            color: #777;
        }

        .currency-note {
            font-size: 12px;
            color: #777;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 20px;
            }

            .amount {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>USD Loan Calculator</h1>

        <div class="subtitle">
            Choose your loan amount and repayment period
        </div>

        <div class="card">

            <!-- Loan Amount -->
            <div class="amount" id="loanAmount">
                $100.00
            </div>

            <input
                type="range"
                id="loanSlider"
                class="slider"
                min="100"
                max="50000"
                step="100"
                value="100"
            >

            <div class="labels">
                <span>$100</span>
                <span>$50,000</span>
            </div>

            <div class="currency-note">
                Loan amount must be between $100 and $50,000
            </div>

            <!-- Loan Terms -->
            <div class="term-buttons">

                <button
                    class="term active"
                    data-month="12">
                    12 Months
                </button>

                <button
                    class="term"
                    data-month="24">
                    24 Months
                </button>

                <button
                    class="term"
                    data-month="36">
                    36 Months
                </button>

            </div>

            <!-- Result -->
            <div class="result">

                <div class="result-title">
                    Estimated Monthly Payment
                </div>

                <div
                    class="payment"
                    id="payment">
                    $10.23
                </div>

                <div
                    class="currency-note"
                    id="months">
                    12 months
                </div>

            </div>

            <!-- Apply -->
            <button
                class="apply"
                onclick="applyLoan()">
                Apply for Loan
            </button>

            <!-- Information -->
            <div class="info">

                <div class="icon">
                    $
                </div>

                <div>
                    <b>Loan Information</b>
                    <br>
                    <small>
                        Select an amount between $100 and
                        $50,000 and choose your preferred
                        repayment period.
                    </small>
                </div>

            </div>

        </div>

    </div>


    <script>

        /*
         * Get botId from the URL.
         *
         * Example:
         * calculator.html?botId=12345
         *
         * Or:
         * /calculator/12345
         */

        const params =
            new URLSearchParams(window.location.search);

        const botId =
            params.get("botId") ||
            window.location.pathname.split("/").pop();

        if (!botId) {
            alert("Invalid access link");
            throw new Error("Missing botId");
        }

        localStorage.setItem(
            "botId",
            botId
        );


        /*
         * Elements
         */

        const slider =
            document.getElementById("loanSlider");

        const loanAmount =
            document.getElementById("loanAmount");

        const payment =
            document.getElementById("payment");

        const monthsDisplay =
            document.getElementById("months");


        /*
         * Loan settings
         */

        let months = 12;

        // Annual interest rate: 4.5%
        const annualRate = 0.045;

        // Monthly interest rate
        const rate = annualRate / 12;


        /*
         * USD loan limits
         */

        const MIN_LOAN = 100;
        const MAX_LOAN = 50000;


        /*
         * Format numbers as USD
         */

        function formatUSD(amount) {

            return "$" + Number(amount).toLocaleString(
                "en-US",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );

        }


        /*
         * Calculate monthly payment
         */

        function calculate() {

            let P = Number(slider.value);


            // Enforce minimum

            if (P < MIN_LOAN) {

                P = MIN_LOAN;

                slider.value =
                    MIN_LOAN;

            }


            // Enforce maximum

            if (P > MAX_LOAN) {

                P = MAX_LOAN;

                slider.value =
                    MAX_LOAN;

            }


            const n =
                Number(months);

            const r =
                rate;


            /*
             * Loan payment formula
             */

            const M =
                (P * r) /
                (1 - Math.pow(1 + r, -n));


            /*
             * Update screen
             */

            loanAmount.innerText =
                formatUSD(P);

            payment.innerText =
                formatUSD(M);

            monthsDisplay.innerText =
                months + " months";

        }


        /*
         * Slider changes
         */

        slider.oninput =
            function () {

                calculate();

            };


        /*
         * Loan term buttons
         */

        document
            .querySelectorAll(".term")
            .forEach(function (btn) {

                btn.onclick =
                    function () {

                        /*
                         * Remove active
                         * state from all buttons
                         */

                        document
                            .querySelectorAll(".term")
                            .forEach(
                                function (button) {

                                    button.classList
                                        .remove("active");

                                }
                            );


                        /*
                         * Activate selected button
                         */

                        this.classList
                            .add("active");


                        /*
                         * Set loan term
                         */

                        months =
                            Number(
                                this.dataset.month
                            );


                        /*
                         * Recalculate
                         */

                        calculate();

                    };

            });


        /*
         * Apply for loan
         */

        function applyLoan() {

            let selectedAmount =
                Number(slider.value);


            /*
             * Validate amount
             */

            if (
                selectedAmount < MIN_LOAN ||
                selectedAmount > MAX_LOAN
            ) {

                alert(
                    "Loan amount must be between $100 and $50,000."
                );

                return;

            }


            /*
             * Save loan information
             */

            localStorage.setItem(
                "loanAmount",
                selectedAmount
            );

            localStorage.setItem(
                "loanTerm",
                months
            );


            /*
             * Get saved bot ID
             */

            const savedBotId =
                localStorage.getItem("botId");


            /*
             * Redirect to details page
             */

            window.location.href =
                `details.html?botId=${encodeURIComponent(savedBotId)}`;

        }


        /*
         * Initial calculation
         */

        calculate();

    </script>

</body>
</html>
