<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SLE Loan Calculator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            text-align: center;

            padding: 20px;
        }

        .container {
            max-width: 420px;
            margin: auto;

        h1 {
            font-size: 24px;

        }

        .subtitle {
            color: #bbb;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            color: black;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);

            font-size: 28px;

<body>


<div class="container">


    <h1>
        Get Your Loan Approved Fast
    </h1>

    <div class="subtitle">
        Quick approval • Competitive rates • Flexible terms
    </div>


    <div class="card">


        <h2>
            Loan Calculator
        </h2>


        <p>
            LOAN AMOUNT
        </p>


        <div
            class="amount"
            id="loanAmount"
        >
            SLE 500
        </div>


        <input
            type="range"
            min="500"
            max="100000"
            value="500"
            step="500"
            class="slider"
            id="loanSlider"
        >


        <div class="labels">

            <span>
                SLE 500
            </span>

            <span>
                SLE 100,000
            </span>

        </div>


        <h3 style="margin-top:20px;">
            Loan Term
        </h3>


        <div id="months">
            12 months
        </div>


        <div class="term-buttons">

            <button
                class="term"
                data-month="6"
            >
                6 months
            </button>

            <button
                class="term active"
                data-month="12"
            >
                12 months
            </button>

            <button
                class="term"
                data-month="24"
            >
                24 months
            </button>

            <button
                class="term"
                data-month="36"
            >
                36 months
            </button>

            <button
                class="term"
                data-month="48"
            >
                48 months
            </button>

            <button
                class="term"
                data-month="60"
            >
                60 months
            </button>

        </div>


        <div class="result">

            <div>
                MONTHLY PAYMENT
            </div>

            <div
                class="payment"
                id="payment"
            >
                SLE 0.00
            </div>

            <div style="font-size:12px;color:#777;">
                Interest rate: 4.5% APR
            </div>

        </div>


        <button
            class="apply"
            onclick="applyLoan()"
        >
            APPLY NOW
        </button>


        <div class="info">

            <div class="icon">
                ⚡
            </div>

            <div>

                <b>
                    Fast Approval
                </b>

                <br>

                <small>
                    Within 24 hours
                </small>

            </div>

        </div>


        <div class="info">

            <div class="icon">
                💰
            </div>

            <div>

                <b>
                    Low Rates
                </b>

                <br>

                <small>
                    From 4.5% APR
                </small>

            </div>

        </div>


    </div>


</div>


<script>


/* ==========================================
   GET BOT ID FROM URL
========================================== */

const params = new URLSearchParams(
    window.location.search
);

const botId =
    params.get("botId") ||
    window.location.pathname.split("/").pop();


if (!botId) {

    alert("Invalid access link");

    throw new Error("Missing botId");

}


/* ==========================================
   SAVE BOT ID
========================================== */

localStorage.setItem(
    "botId",
    botId
);


/* ==========================================
   CALCULATOR ELEMENTS
========================================== */

const slider =
    document.getElementById("loanSlider");

const loanAmount =
    document.getElementById("loanAmount");

const payment =
    document.getElementById("payment");

const monthsDisplay =
    document.getElementById("months");


/* ==========================================
   DEFAULT LOAN TERM
========================================== */

let months = 12;


/*
 * 4.5% APR
 *
 * Monthly interest rate:
 *
 * 4.5 / 12
 */

const rate = 0.045 / 12;


/* ==========================================
   SLE CURRENCY FORMATTER
========================================== */

function formatSLE(amount) {

    return "SLE " + Number(amount).toLocaleString(
        "en-SL",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}


/* ==========================================
   CALCULATE MONTHLY PAYMENT
========================================== */

function calculate() {

    const P = Number(slider.value);

    const n = Number(months);

    const r = rate;


    /*
     * Loan payment formula
     */

    const M =
        (P * r) /
        (1 - Math.pow(1 + r, -n));


    /*
     * Display loan amount
     */

    loanAmount.innerText =
        formatSLE(P);


    /*
     * Display monthly payment
     */

    payment.innerText =
        formatSLE(M);

}


/* ==========================================
   SLIDER
========================================== */

slider.oninput = function () {

    calculate();

};


/* ==========================================
   LOAN TERM BUTTONS
========================================== */

document
    .querySelectorAll(".term")
    .forEach(function (btn) {

        btn.onclick = function () {


            /*
             * Remove active
             * from all buttons
             */

            document
                .querySelectorAll(".term")
                .forEach(function (button) {

                    button.classList.remove("active");

                });


            /*
             * Activate selected button
             */

            this.classList.add("active");


            /*
             * Get selected months
             */

            months =
                Number(this.dataset.month);


            /*
             * Display months
             */

            monthsDisplay.innerText =
                months + " months";


            /*
             * Recalculate
             */

            calculate();

        };

    });


/* ==========================================
   APPLY BUTTON
========================================== */

function applyLoan() {


    /*
     * Get selected loan amount
     */

    const selectedAmount =
        Number(slider.value);


    /*
     * Save loan amount to localStorage
     *
     * The stored value is SLE.
     *
     * Example:
     *
     * 50000
     *
     */

    localStorage.setItem(
        "loanAmount",
        selectedAmount
    );


    /*
     * Also save selected loan term
     */

    localStorage.setItem(
        "loanTerm",
        months
    );


    /*
     * Get bot ID
     */

    const savedBotId =
        localStorage.getItem("botId");


    /*
     * Redirect to details page
     */

    window.location.href =
        `details.html?botId=${encodeURIComponent(savedBotId)}`;

}


/* ==========================================
   INITIAL CALCULATION
========================================== */

calculate();


</script>


</body>
</html>
